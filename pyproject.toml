[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex9-rust-batbadbut-args-model"
version = "0.1.0"
description = "Offline re-implementation of Rust std 1.77.1 vs 1.77.2 batch-file argument encoding (CVE-2024-24576)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rust-bat-args-model = "rust_bat_args_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
